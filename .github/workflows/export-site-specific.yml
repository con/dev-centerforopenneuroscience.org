name: Export site-specific subtree

on:
  push:
    branches:
      - main
    paths:
      - site-specific/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-site-specific
  cancel-in-progress: false

jobs:
  export:
    name: Fast-forward con-site-specific
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a repository-limited Orinoco Lite App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4704454
          private-key: ${{ secrets.ORINOCO_LITE_APP_PRIVATE_KEY }}
          owner: ORINOCO-Lite
          repositories: con-site-specific

      - name: Check out the complete downstream history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push the site-specific history
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "orinoco-lite-curation-review[bot]"
          git config user.email "4704454+orinoco-lite-curation-review[bot]@users.noreply.github.com"
          git remote add site-specific \
            "https://x-access-token:${APP_TOKEN}@github.com/ORINOCO-Lite/con-site-specific.git"
          git fetch site-specific main

          split_sha="$(git subtree split --prefix=site-specific "$GITHUB_SHA")"
          upstream_sha="$(git rev-parse refs/remotes/site-specific/main)"

          if ! git merge-base --is-ancestor "$upstream_sha" "$split_sha"; then
            echo "con-site-specific/main has diverged from the downstream subtree." >&2
            echo "Pull and review it in the downstream before exporting again." >&2
            exit 1
          fi

          git push site-specific "$split_sha:refs/heads/main"
