repos:
  - repo: local
    hooks:
      - id: snapper
        name: snapper semantic line breaks
        entry: snapper --in-place
        language: system
        files: '\.(md|markdown|rst|txt)$'
      - id: site-specific-commit-boundary
        name: Keep site-specific changes in separate commits
        entry: python .github/scripts/check_site_specific_commit_scope.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
