# Netlify builds pull-request deploy previews for this site and nothing else.
# The canonical site stays on GitHub Pages, published from the default branch
# by .github/workflows/pages.yml.
#
# A preview may select an exact unreleased package commit in
# `.orinoco-lite/candidate-preview.toml`; production never reads that file.

[build]
  publish = "build/site"
  command = "curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.73.0 sh && $HOME/.pixi/bin/pixi run --frozen build"

[context.deploy-preview]
  command = "curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.76.2 sh && PATH=\"$HOME/.pixi/bin:$PATH\" $HOME/.pixi/bin/pixi run --frozen python .orinoco-lite/tools/netlify_candidate_preview.py"

# An ignore command that exits 0 cancels the build, so Netlify never publishes
# a second copy of the canonical site or of an arbitrary branch.
[context.production]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
